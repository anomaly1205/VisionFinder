<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · VisionFinder Home</title>
  <meta name="description" content="Log in or create a VisionFinder account.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' fill='%23fff' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Gilda+Display&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="wrap page">
    <div id="crumbs"></div>
    <section class="auth" aria-labelledby="auth-title">
      <div class="auth-visual">
        <img src="assets/products/A1CaMEMOy-L.webp" alt="A living room with a grey sofa and a patterned wool rug" width="1000" height="1000">
        <div class="auth-pitch">
          <p class="eyebrow">VisionFinder Home</p>
          <p class="auth-quote">Saw a piece you love? Show us a photo and we find it in the catalog.</p>
          <p>One account keeps your cart, wishlist and past searches together.</p>
        </div>
      </div>

      <div class="auth-card">
        <h1 id="auth-title">Your account</h1>
        <p class="auth-lede">Log in, or create an account in under a minute.</p>
        <div class="auth-tabs" role="tablist" aria-label="Log in or register">
          <button type="button" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true">Log in</button>
          <button type="button" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" tabindex="-1">Register</button>
        </div>

        <form class="auth-form" id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
          <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
          <p class="form-error" role="alert" hidden></p>
          <button class="btn btn-ai" type="submit">Log in</button>
        </form>

        <form class="auth-form" id="panel-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
          <label class="field"><span>Name</span><input name="name" type="text" autocomplete="name" maxlength="100" required></label>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" maxlength="255" placeholder="you@example.com" required></label>
          <label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="pw-hint"></label>
          <p class="field-hint" id="pw-hint">At least 8 characters.</p>
          <p class="form-error" role="alert" hidden></p>
          <button class="btn btn-ai" type="submit">Create account</button>
        </form>

        <p class="auth-or"><span>or</span></p>
        <div class="auth-social">
          <button class="social-btn social-google" type="button" data-social><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" stroke="none" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z"/><path fill="#34A853" stroke="none" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" stroke="none" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z"/><path fill="#EA4335" stroke="none" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6Z"/></svg>Continue with Google</button>
          <button class="social-btn social-facebook" type="button" data-social><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1877F2" stroke="none"/><path fill="#fff" stroke="none" d="M13.4 22v-7.2h2.4l.4-2.9h-2.8v-1.8c0-.8.2-1.4 1.4-1.4h1.5V6.1a20 20 0 0 0-2.2-.1c-2.2 0-3.7 1.3-3.7 3.8v2.1H8v2.9h2.4V22h3Z"/></svg>Continue with Facebook</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
